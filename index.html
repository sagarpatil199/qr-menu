<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <!--
    QR Menu template.
    You do NOT need to edit this file for a new restaurant.
    Restaurant details come from data/restaurant.json, the menu from data/menu.json.
    The generic values below are fallbacks; JavaScript replaces them at load time.
  -->
  <title>Digital Menu</title>
  <meta name="description" content="View our full digital menu with prices, photos and today's availability.">
  <meta name="theme-color" content="#8B0000">
  <meta name="format-detection" content="telephone=no">
  <link rel="canonical" href="" id="canonical-link">

  <!-- Open Graph (link previews on WhatsApp, Facebook, etc.) -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Digital Menu">
  <meta property="og:description" content="View our full digital menu with prices, photos and today's availability.">
  <meta property="og:image" content="assets/logo/logo.svg">
  <meta property="og:url" content="">
  <meta name="twitter:card" content="summary">

  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml" id="favicon">
  <link rel="apple-touch-icon" href="assets/icons/favicon.svg">
  <link rel="stylesheet" href="css/style.css">

  <script defer src="js/menu.js"></script>
  <script defer src="js/ui.js"></script>
  <script defer src="js/app.js"></script>
</head>
<body class="is-loading">
  <a class="skip-link" href="#menu">Skip to menu</a>

  <!-- Inline icon sprite: no extra network requests -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <symbol id="i-phone" viewBox="0 0 24 24"><path fill="currentColor" d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"/></symbol>
    <symbol id="i-whatsapp" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.15l-.3-.18-3 .78.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.25-.12-1.47-.72-1.7-.8s-.39-.13-.56.12-.64.8-.78.97-.29.19-.54.06a6.7 6.7 0 0 1-3.3-2.9c-.25-.43.25-.4.71-1.33a.45.45 0 0 0-.02-.42c-.06-.12-.56-1.35-.77-1.85s-.4-.42-.56-.43h-.48a.92.92 0 0 0-.67.31 2.8 2.8 0 0 0-.87 2.08 4.9 4.9 0 0 0 1.02 2.58 11.1 11.1 0 0 0 4.27 3.77c1.58.68 2.2.74 3 .62a2.55 2.55 0 0 0 1.68-1.18 2.07 2.07 0 0 0 .14-1.18c-.06-.1-.23-.17-.48-.29z"/></symbol>
    <symbol id="i-pin" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2a7 7 0 0 0-7 7c0 5.25 7 13 7 13s7-7.75 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" d="M10.5 18a7.5 7.5 0 1 1 0-15 7.5 7.5 0 0 1 0 15zM16 16l5 5"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" d="M6 6l12 12M18 6L6 18"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M12 7v5l3 2"/></symbol>
    <symbol id="i-instagram" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="17.5" cy="6.5" r="1.3" fill="currentColor"/></symbol>
    <symbol id="i-facebook" viewBox="0 0 24 24"><path fill="currentColor" d="M14 8.5V6.8c0-.8.2-1.3 1.4-1.3H17V2.3c-.3 0-1.3-.1-2.5-.1-2.5 0-4.2 1.5-4.2 4.3v2H7.5V12h2.8v9.8H14V12h2.8l.4-3.5H14z"/></symbol>
    <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path fill="none" stroke="currentColor" stroke-width="2" d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9S14.5 18.4 12 21c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"/></symbol>
    <symbol id="i-mail" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path fill="none" stroke="currentColor" stroke-width="2" d="M3.5 6l8.5 7 8.5-7"/></symbol>
    <symbol id="i-chili" viewBox="0 0 24 24"><path fill="currentColor" d="M17.6 5.3c.6-1.4 1.6-2.2 2.9-2.3l.2 1.5c-.6.1-1.1.4-1.4 1.1 1.4.9 2 2.6 1.4 4.4C19 15.6 12.4 21 4.3 21c-1 0-1.6-1.1-1-1.9 4.5-.3 8-4.1 10-8.8.9-2.2 2.4-4.6 4.3-5z"/></symbol>
    <symbol id="i-arrow-up" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" d="M12 19V5M5 12l7-7 7 7"/></symbol>
    <symbol id="i-plate" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="12" r="5.5" fill="none" stroke="currentColor" stroke-width="1.2"/></symbol>
  </svg>

  <!-- ============ HEADER ============ -->
  <header class="hero" id="top">
    <div class="hero__inner">
      <img class="hero__logo" id="restaurant-logo" src="" alt="" width="96" height="96" hidden>
      <h1 class="hero__name" id="restaurant-name">Our Menu</h1>
      <p class="hero__tagline" id="restaurant-tagline" hidden></p>
      <p class="hero__status" id="open-status" hidden></p>

      <nav class="hero__actions" id="contact-actions" aria-label="Contact the restaurant"></nav>
    </div>
  </header>

  <main id="menu" tabindex="-1">
  <p class="notice" id="restaurant-notice" role="note" hidden></p>

  <!-- ============ STICKY TOOLBAR: search, filters, categories ============ -->
  <div class="toolbar" id="toolbar">
    <div class="toolbar__inner">
      <div class="search">
        <label for="search-input" class="visually-hidden">Search menu</label>
        <svg class="search__icon" aria-hidden="true"><use href="#i-search"/></svg>
        <input type="search" id="search-input" class="search__input" placeholder="Search menu..." autocomplete="off" enterkeyhint="search">
        <button type="button" class="search__clear" id="search-clear" aria-label="Clear search" hidden>
          <svg aria-hidden="true"><use href="#i-close"/></svg>
        </button>
      </div>

      <div class="filters" id="filters" role="group" aria-label="Filter menu">
        <button type="button" class="chip is-active" data-filter="all" aria-pressed="true">All</button>
        <button type="button" class="chip" data-filter="veg" aria-pressed="false"><span class="diet diet--veg diet--sm" aria-hidden="true"></span>Veg</button>
        <button type="button" class="chip" data-filter="nonveg" aria-pressed="false"><span class="diet diet--nonveg diet--sm" aria-hidden="true"></span>Non-Veg</button>
        <button type="button" class="chip" data-filter="available" aria-pressed="false">Available</button>
        <button type="button" class="chip" data-filter="bestseller" aria-pressed="false">Bestsellers</button>
        <button type="button" class="chip" data-filter="new" aria-pressed="false">New</button>
      </div>
    </div>

    <nav class="catnav" id="category-nav" aria-label="Menu categories">
      <ul class="catnav__list" id="category-nav-list"></ul>
    </nav>
  </div>

  <!-- ============ MENU ============ -->
  <div class="menu" id="menu-content">
    <p class="visually-hidden" id="results-status" role="status" aria-live="polite"></p>

    <div class="loader" id="loader" aria-hidden="true">
      <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
    </div>

    <div id="menu-sections"></div>

    <div class="empty" id="empty-state" hidden>
      <svg class="empty__icon" aria-hidden="true"><use href="#i-plate"/></svg>
      <h2 class="empty__title">No dishes found</h2>
      <p class="empty__text" id="empty-text">Try a different search or filter.</p>
      <button type="button" class="btn btn--primary" id="reset-filters">Show full menu</button>
    </div>

    <div class="error" id="error-state" role="alert" hidden>
      <h2 class="error__title">Menu could not be loaded</h2>
      <p class="error__text" id="error-text"></p>
    </div>
  </div>
  </main>

  <!-- ============ FOOTER / RESTAURANT INFO ============ -->
  <footer class="info" id="info" aria-labelledby="info-title">
    <div class="info__inner">
      <h2 class="info__title" id="info-title">Visit Us</h2>
      <div class="info__grid">
        <section class="info__card" id="info-contact" aria-labelledby="info-contact-title">
          <h3 id="info-contact-title">Contact &amp; Location</h3>
          <ul class="info__list" id="info-contact-list"></ul>
          <div class="info__social" id="info-social"></div>
        </section>
        <section class="info__card" id="info-hours" aria-labelledby="info-hours-title" hidden>
          <h3 id="info-hours-title">Opening Hours</h3>
          <table class="hours"><tbody id="hours-body"></tbody></table>
        </section>
      </div>
      <p class="info__note" id="footer-note" hidden></p>
      <p class="info__copy"><span id="footer-copy"></span> <a href="#top" class="info__top">Back to top</a></p>
    </div>
  </footer>

  <button type="button" class="to-top" id="to-top" aria-label="Back to top" hidden>
    <svg aria-hidden="true"><use href="#i-arrow-up"/></svg>
  </button>

  <!-- ============ FOOD DETAIL MODAL ============ -->
  <dialog class="modal" id="item-modal" aria-labelledby="modal-title">
    <div class="modal__panel">
      <button type="button" class="modal__close" id="modal-close" aria-label="Close dish details">
        <svg aria-hidden="true"><use href="#i-close"/></svg>
      </button>
      <div class="modal__media" id="modal-media"></div>
      <div class="modal__body">
        <div class="modal__meta" id="modal-meta"></div>
        <h2 class="modal__title" id="modal-title"></h2>
        <p class="modal__category" id="modal-category"></p>
        <p class="modal__desc" id="modal-desc"></p>
        <div class="modal__price" id="modal-price"></div>
        <p class="modal__availability" id="modal-availability"></p>
      </div>
    </div>
  </dialog>

  <noscript>
    <p class="noscript">Please enable JavaScript to view the menu.</p>
  </noscript>
</body>
</html>
